<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brandweer App - Inloggen</title>
  
  <!-- PWA Metadata & Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d32f2f">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a1a 0%, #2a0808 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
    }

    .login-card {
      background: rgba(30, 30, 30, 0.95);
      border: 2px solid #d32f2f;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(211, 47, 47, 0.3);
      width: 100%;
      max-width: 400px;
      padding: 30px;
      text-align: center;
    }

    .badge-icon {
      font-size: 50px;
      margin-bottom: 15px;
      display: inline-block;
    }

    h1 {
      color: #ff4d4d;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p.subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #ddd;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2b2b2b;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #ff4d4d;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .checkbox-group input {
      accent-color: #d32f2f;
      width: 18px;
      height: 18px;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s, background 0.3s;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #ff4d4d 0%, #d32f2f 100%);
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="badge-icon">🚒</div>
    <h1>Brandweer App</h1>
    <p class="subtitle">Meld u aan om toegang te krijgen</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Naam</label>
        <input type="text" id="username" placeholder="Voer je naam in..." required>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="rememberMe">
        <span>Onthoud mijn naam op dit apparaat</span>
      </label>

      <button type="submit" class="btn-login">Inloggen</button>
    </form>
  </div>

  <!-- Firebase Scripts (Modular SDK v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuratie
    const firebaseConfig = {
      apiKey: "AIzaSyD-whPB4HLBA_FZkYr5OtmJRR7ofXs_s_0",
      authDomain: "bwhnew.firebaseapp.com",
      projectId: "bwhnew",
      storageBucket: "bwhnew.firebasestorage.app",
      messagingSenderId: "822224776722",
      appId: "1:822224776722:web:ad39bec266c20a6622b2cb",
      measurementId: "G-5CRMVYSQ7W"
    };

    // Initialiseer Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Inloglogica & Onthoudfunctie
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const rememberMeCheckbox = document.getElementById('rememberMe');

    // Automatisch invullen/doorsturen als 'rememberMe' geactiveerd was
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('bw_username');
      if (savedName) {
        // Direct doorsturen als de gebruiker al opgeslagen is
        window.location.href = 'home.html';
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();

      if (username) {
        if (rememberMeCheckbox.checked) {
          localStorage.setItem('bw_username', username);
        } else {
          sessionStorage.setItem('bw_username', username);
        }

        // Stuur door naar home.html
        window.location.href = 'home.html';
      }
    });
  </script>

  <!-- Service Worker Registratie -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker geregistreerd:', reg.scope))
          .catch(err => console.error('Service Worker registratie mislukt:', err));
      });
    }
  </script>
</body>
</html>
