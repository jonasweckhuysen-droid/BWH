<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b5121b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BWH 2.0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <title>BWH 2.0 - Aanmelden</title>
  <script src="register-sw.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand">
        <div class="brand-mark">BWH</div>
        <div>
          <h1>BWH 2.0</h1>
          <p>Brandweer Herentals</p>
        </div>
      </div>

      <div class="fire-icon">🔥</div>
      <h2>Welkom</h2>
      <p class="intro">Meld je aan om toegang te krijgen tot BWH 2.0.</p>

      <form id="loginForm" autocomplete="on">
        <label for="name">Naam</label>
        <input id="name" name="name" type="text" placeholder="Geef je naam in"
               autocomplete="name" autocapitalize="words" required maxlength="80">

        <label class="remember">
          <input id="remember" type="checkbox">
          <span>Mijn naam onthouden</span>
        </label>

        <button type="submit" class="primary-btn">
          Aanmelden <span>→</span>
        </button>

        <p id="message" class="message" role="alert"></p>
      </form>

      <div class="install-box" id="installBox" hidden>
        <strong>📱 Installeer BWH 2.0</strong>
        <span>Gebruik de knop hieronder om de app op je toestel te installeren.</span>
        <button id="installBtn" class="secondary-btn">App installeren</button>
      </div>
    </section>

    <footer>© BWH 2.0 · Brandweer Herentals</footer>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
